<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Site header mobile — Leo District Council 325 K</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&amp;family=Public+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<header style="position: sticky; top: 0; z-index: 50; width: 390px; font-family: 'Public Sans', sans-serif; color: #FFFFFF">
<div style="height: 68px; box-sizing: border-box; background: linear-gradient(90deg, #244D63 0%, #244D63 35%, #2E4A7A 52%, #4B3F86 70%, #6A3290 88%, #762B94 100%); padding: 0 12px 0 14px; display: flex; align-items: center; gap: 10px">
<a href="Mobile.dc.html" style="flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 10px; text-decoration: none; color: #FFFFFF">
<img src="/brand/lions-international-logo.png" alt="Lions International" style="height: 42px; width: auto">
<span style="display: flex; flex-direction: column; min-width: 0">
<span style="font-family: 'Lato', sans-serif; font-weight: 900; font-size: 15px; line-height: 1.2">Leo District Council 325 K</span>
<span style="font-family: 'Lato', sans-serif; font-weight: 700; font-size: 12px; color: #FCCC0A">Nepal · LY 2026–27</span>
</span>
</a>
<a href="MobileMenu.dc.html" aria-label="Open menu" style="flex: 0 0 44px; height: 44px; box-sizing: border-box; border-radius: 10px; border: 1px solid #4F7A90; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></a>
</div>
<div style="height: 4px; background: #FCCC0A"></div>
<sc-if value="{{full}}" hint-placeholder-val="{{ true }}">
<div style="height: 3px; background: #156FAC"></div>
<div role="list" aria-label="LY 2026–27 theme badges" style="height: 60px; box-sizing: border-box; background: linear-gradient(90deg, #1A4359 0%, #2E4A7A 22%, #4B3F86 45%, #6A3290 70%, #762B94 90%); display: flex; align-items: center; justify-content: center; gap: 10px">
<img src="/brand/badge-1-we-serve.png" alt="We Serve — Rooted in Service" style="height: 46px; width: auto">
<img src="/brand/badge-2-lions-325k-round.png" alt="Lions District 325 K: Leading with Purpose (round)" style="height: 46px; width: auto">
<img src="/brand/badge-3-lions-325k-quatrefoil.png" alt="Lions District 325 K: Leading with Purpose (quatrefoil)" style="height: 46px; width: auto">
<img src="/brand/badge-4-leo-md325.png" alt="Leo Multiple District 325: Every Step Inspires" style="height: 46px; width: auto">
<img src="/brand/badge-5-ldc325k-execution.png" alt="Leo District Council 325 K: Execution with Excellence" style="height: 46px; width: auto">
</div>
<div style="height: 3px; background: #F6961E"></div>
</sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["full","compact"],"default":"full"},"$preview":{"width":390,"height":138}}'>
class Component extends DCLogic {
  renderVals() {
    return { full: (this.props.variant ?? 'full') !== 'compact' };
  }
}
</script>
</body>
</html>
