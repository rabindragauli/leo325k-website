<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin sidebar — Leo 325 K</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&amp;family=Public+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Admin" style="width: 100%; min-height: 900px; box-sizing: border-box; padding: 20px 14px; font-family: 'Public Sans', sans-serif; color: #FFFFFF; background: #1B3A4B; display: flex; flex-direction: column; gap: 22px">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #FFFFFF; padding: 0 6px">
<img src="/brand/leo-emblem.png" alt="Leo emblem" style="flex: 0 0 auto; height: 42px; width: auto; filter: brightness(1.9)">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-family: 'Lato', sans-serif; font-weight: 700; font-size: 16px; line-height: 1.2">Leo 325 K Admin</span>
<span style="font-size: 12px; color: #B9C5DC">Phase 1 portal</span>
</div>
</a>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #9DB8C6; padding: 0 10px 6px">{{g.label}}</span>
<sc-for list="{{g.items}}" as="i" hint-placeholder-count="2">
<a href="{{i.href}}" aria-current="{{i.current}}" style="min-height: 44px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 0 10px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 600; background: {{i.bg}}; color: {{i.fg}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{i.icon}}"></path></svg>
<span style="flex: 1 1 auto">{{i.label}}</span>
<sc-if value="{{i.badge}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; font-weight: 800; min-width: 22px; height: 22px; border-radius: 999px; background: #FCCC0A; color: #1B3A4B; display: flex; align-items: center; justify-content: center">{{i.badge}}</span></sc-if>
</a>
</sc-for>
</div>
</sc-for>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px">
<a href="https://claude.ai/artifact/6SDeEp6QkWqjDwpJbiQrTM" target="_blank" rel="noopener" style="min-height: 44px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 0 12px; border: 1px solid #3F6A80; border-radius: 10px; color: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: 600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"></path></svg>View live site</a>
<div style="display: flex; align-items: center; gap: 10px; padding: 12px 10px; border-top: 1px solid #2B5266">
<span style="flex: 0 0 38px; height: 38px; border-radius: 50%; background: #FCCC0A; color: #1B3A4B; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800">RG</span>
<div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column">
<span style="font-size: 14px; font-weight: 700">Rabindra Gauli</span>
<span style="font-size: 12px; color: #B9C5DC">Admin</span>
</div>
<a href="Login.dc.html" aria-label="Sign out" style="flex: 0 0 40px; height: 40px; border-radius: 10px; color: #D3DCEC; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 17l5-5-5-5M15 12H3"></path></svg></a>
</div>
</div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["dashboard","leadership","clubs","resources","content","messages","users"],"default":"dashboard"},"$preview":{"width":264,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'dashboard';
    const I = {
      dashboard: 'M3 3h7v9H3z M14 3h7v5h-7z M14 12h7v9h-7z M3 16h7v5H3z',
      leadership: 'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2 M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M22 21v-2a4 4 0 0 0-3-3.9 M16 3.1a4 4 0 0 1 0 7.8',
      clubs: 'M3 21h18 M5 21V8l7-5 7 5v13 M9 21v-6h6v6',
      resources: 'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z M14 2v6h6 M12 18v-6 M9 15l3 3 3-3',
      content: 'M12 20h9 M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z',
      messages: 'M3 7l9 6 9-6 M5 5h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z',
      users: 'M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6z M9 12l2 2 4-4'
    };
    const item = (key, label, href, badge) => ({
      label: label, href: href, icon: I[key], badge: badge || '',
      current: key === active ? 'page' : 'false',
      bg: key === active ? '#FCCC0A' : 'transparent',
      fg: key === active ? '#1B3A4B' : '#D3DCEC'
    });
    return {
      groups: [
        { label: 'Overview', items: [ item('dashboard', 'Dashboard', 'Main.dc.html'), item('messages', 'Messages', 'Messages.dc.html', '3') ] },
        { label: 'Website content', items: [ item('leadership', 'Leadership', 'Leadership.dc.html'), item('clubs', 'Clubs', 'Clubs.dc.html'), item('resources', 'Resources', 'Resources.dc.html'), item('content', 'Site content', 'Content.dc.html') ] },
        { label: 'Administration', items: [ item('users', 'Users & roles', 'Users.dc.html') ] }
      ]
    };
  }
}
</script>
</body>
</html>
